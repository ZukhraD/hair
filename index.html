<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Пошаговые уроки укладки: утюжок, плойка, брашинг, Dyson Airwrap HS08 и HS09.">
<title>Укладка по шагам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}

/* Layout: одна колонка-«урок»: профиль волос → техника → шаги со схемой слева и текстом справа */
:root{
  --bg:#F3F1F5; --surface:#FFFFFF; --surface2:#F8F6FA; --ink:#221C2B; --muted:#6C6476; --line:#DDD7E3;
  --accent:#B03A6A; --accent-soft:#F7E4EC; --accent-ink:#8E2653;
  --hair:#7A4A2E; --hair2:#A9744D; --tool:#2E2A37; --heat:#E2692B; --air:#2B88BD; --skin:#EDCDB3;
  --warn-bg:#FFF4E2; --warn-ink:#7A4A06;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15121A; --surface:#201B27; --surface2:#1A1620; --ink:#F1ECF4; --muted:#A99FB3; --line:#383141;
  --accent:#E56C9D; --accent-soft:#3A2030; --accent-ink:#F4A6C4;
  --hair:#C28A5C; --hair2:#8C5A37; --tool:#CFC7D9; --heat:#F28A4E; --air:#5DB6E8; --skin:#C7A285;
  --warn-bg:#33270F; --warn-ink:#F2C878; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15121A; --surface:#201B27; --surface2:#1A1620; --ink:#F1ECF4; --muted:#A99FB3; --line:#383141;
  --accent:#E56C9D; --accent-soft:#3A2030; --accent-ink:#F4A6C4;
  --hair:#C28A5C; --hair2:#8C5A37; --tool:#CFC7D9; --heat:#F28A4E; --air:#5DB6E8; --skin:#C7A285;
  --warn-bg:#33270F; --warn-ink:#F2C878; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.1;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.lead{margin:8px 0 0;color:var(--muted);max-width:56ch}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.group{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:600;font-size:.92rem;line-height:1.2}
.chips label small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.chips input:checked+label{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips input:checked+label small{color:var(--surface);opacity:.75}
.chips input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
@media (max-width:480px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:.88rem;padding:10px 6px;border-radius:10px;cursor:pointer;line-height:1.2}
.tab small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.tab[aria-selected="true"] small{color:#fff;opacity:.85}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.lesson-head{display:flex;flex-direction:column;gap:10px}
.lesson-head h2{font-family:var(--f-display);font-weight:500;font-size:1.35rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:1.02rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:.95rem}
.need{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.need li{font-size:.88rem;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr;counter-increment:s}
@media (min-width:660px){.step{grid-template-columns:280px 1fr}}
.fig{background:var(--surface2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px}
@media (min-width:660px){.fig{border-bottom:0;border-right:1px solid var(--line)}}
.fig svg{width:100%;max-width:340px;height:auto;display:block}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.body h3{font-size:1.05rem;font-weight:700;display:flex;gap:10px;align-items:baseline}
.body h3::before{content:counter(s);font-family:var(--f-display);font-size:.85rem;color:var(--accent);min-width:1.1em}
.body p{margin:0;max-width:62ch}
.tip{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:.93rem}
.tip strong{color:var(--accent-ink)}

.mist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:10px}
.mist li::before{content:"✕";color:var(--accent);font-weight:700}
.foot{color:var(--muted);font-size:.85rem}
.note{margin:0;color:var(--muted);font-size:.88rem;max-width:62ch}

/* SVG */
svg .lbl{font-family:var(--f-body);font-size:11px;font-weight:600;fill:var(--muted)}
svg .lblA{font-family:var(--f-body);font-size:11px;font-weight:700;fill:var(--accent)}
svg .num{font-family:var(--f-display);font-size:12px;font-weight:700;fill:#fff}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 3.2s linear infinite;animation-delay:-2.4s}
@keyframes draw{0%{stroke-dashoffset:1}75%,100%{stroke-dashoffset:0}}
.slide{animation:slide 3.2s linear infinite;animation-delay:-2.4s}
@keyframes slide{0%{transform:translateY(0)}75%,100%{transform:translateY(112px)}}
.slide2{animation:slide2 3.2s ease-in-out infinite;animation-delay:-1.6s}
@keyframes slide2{0%{transform:translateY(0)}80%,100%{transform:translateY(84px)}}
.flow{stroke-dasharray:4 5;animation:flow .8s linear infinite}
@keyframes flow{to{stroke-dashoffset:-9}}
.puff{animation:puff 1.8s ease-in-out infinite}
@keyframes puff{0%,100%{opacity:.25}50%{opacity:1}}
.drop{animation:drop 2.6s ease-in-out infinite}
@keyframes drop{0%,15%{transform:translateY(0);opacity:1}85%,100%{transform:translateY(26px);opacity:.35}}
@media (prefers-reduced-motion: reduce){
  .draw,.slide,.slide2,.flow,.puff,.drop{animation:none}
  .draw{stroke-dashoffset:0}
}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="eyebrow">Прототип курса</div>
    <h1>Укладка <em>по шагам</em></h1>
    <p class="lead">Выберите свои волосы и технику. Шаги, температура и размер инструмента подстроятся под вас.</p>
  </header>

  <section class="panel" aria-label="Ваши волосы">
    <div class="group"><span class="eyebrow">Тип волос</span><div class="chips" id="g-type"></div></div>
    <div class="group"><span class="eyebrow">Густота</span><div class="chips" id="g-density"></div></div>
    <div class="group"><span class="eyebrow">Длина</span><div class="chips" id="g-length"></div></div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>

  <section id="lesson" class="lesson-head" aria-live="polite"></section>
  <ol class="steps" id="steps"></ol>

  <section class="lesson-head">
    <h2>Частые ошибки</h2>
    <ul class="mist" id="mistakes"></ul>
  </section>

  <p class="foot">Схемы условные. Температуру и время всегда сверяйте с инструкцией к своему инструменту.</p>
</div>

<script>
/* ---------- профиль ---------- */
const OPTS={
  type:[["straight","Прямые"],["wavy","Волнистые"],["curly","Кудрявые"]],
  density:[["fine","Тонкие"],["medium","Средние"],["thick","Густые"]],
  length:[["short","Короткие","до подбородка"],["medium","Средние","до плеч"],["long","Длинные","до лопаток"],["xlong","Очень длинные","ниже лопаток"]]
};
let P={type:"straight",density:"medium",length:"medium"};
let T="iron";
let D={model:"hs08",barrel:null};
try{const s=JSON.parse(localStorage.getItem("ukl-profile")||"null");if(s&&s.type)P=s;}catch(e){}
try{const s=JSON.parse(localStorage.getItem("ukl-dyson")||"null");if(s&&s.model)D=s;}catch(e){}
let h=(location.hash||"").slice(1);if(h==="styler")h="dyson";if(["iron","plojka","brush","dyson"].includes(h))T=h;
const isLong=p=>p.length==="long"||p.length==="xlong";

/* ---------- SVG-хелперы ---------- */
let uid=0;
const svg=(inner,aria)=>`<svg viewBox="0 0 320 180" role="img" aria-label="${aria}">${inner}</svg>`;
const L=(x,y,t,a="middle",c="lbl")=>`<text x="${x}" y="${y}" text-anchor="${a}" class="${c}">${t}</text>`;
const head=(x,y,a,c="var(--accent)")=>`<path d="M0 0 L-9 -5 L-9 5 Z" transform="translate(${x} ${y}) rotate(${a})" fill="${c}"/>`;
const strand=(x,y1,y2,w=16,op=1)=>`<path d="M${x-w/2} ${y1} L${x+w/2} ${y1} L${x+w/2-3} ${y2} Q${x} ${y2+6} ${x-w/2+3} ${y2} Z" fill="var(--hair)" opacity="${op}"/><path d="M${x-2} ${y1+5} L${x-3} ${y2-5} M${x+3} ${y1+5} L${x+2} ${y2-5}" stroke="var(--hair2)" stroke-width="1.3" fill="none" opacity="${op}"/>`;
function curl(cx,y0,y1,amp,n){let d=`M${cx} ${y0}`;const s=(y1-y0)/n;for(let i=0;i<n;i++){const k=i%2?-1:1,a=y0+i*s,b=a+s;d+=` C${cx+k*amp*1.4} ${a+s*.15}, ${cx+k*amp*1.4} ${b-s*.15}, ${cx} ${b}`;}return d;}
function barrelG(x,y,w,h,kind,anim,noCoils){
  const con=kind==="conical";
  const edge=yy=>{if(!con)return[x,x+w];const t=Math.max(0,Math.min(1,(yy-y)/h)),ww=w*(.5+.5*t),c=x+w/2;return[c-ww/2,c+ww/2];};
  const shape=con?`<path d="M${x} ${y+h} L${x+w} ${y+h} L${x+w*.75} ${y+5} Q${x+w/2} ${y-3} ${x+w*.25} ${y+5} Z" fill="var(--tool)" opacity=".9"/>`:`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${w/2}" fill="var(--tool)" opacity=".9"/>`;
  const hand=`<rect x="${x+4}" y="${y+h-2}" width="${w-8}" height="30" rx="6" fill="var(--tool)"/>`;
  let coils="";
  if(!noCoils)for(let i=0;i<5;i++){const yy=y+16+i*(h-34)/4,[l,r]=edge(yy);coils+=`<path d="M${l} ${yy} Q${(l+r)/2} ${yy+16} ${r} ${yy+6}" ${anim?`pathLength="1" class="draw" style="animation-delay:${-2.4+i*.25}s"`:""} stroke="var(--hair)" stroke-width="10" fill="none" stroke-linecap="round"/>`;}
  return shape+hand+coils;
}
const HEAD="M160 20 C112 20 96 54 96 84 L94 148 C94 162 226 162 226 148 L224 84 C224 54 208 20 160 20 Z";

const F={
  prep:(name="термозащита")=>{
    const pts=[[104,64],[116,58],[118,72],[130,52],[134,66],[136,80],[150,48],[152,62],[154,76],[156,90],[170,44],[172,58],[174,72],[176,86],[178,100],[190,52],[192,70],[194,88]];
    const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="var(--air)" class="puff" style="animation-delay:${(i%6)*.25}s"/>`).join("");
    return svg(`<rect x="46" y="80" width="40" height="80" rx="8" fill="var(--tool)"/><rect x="54" y="62" width="24" height="20" rx="3" fill="var(--tool)"/><rect x="78" y="64" width="16" height="6" rx="2" fill="var(--tool)"/>${dots}${strand(232,14,166,24)}${L(66,176,"спрей")}${L(150,30,name,"middle","lblA")}`,"Нанесение средства на волосы");
  },
  sections:(n=3)=>{
    const id="cl"+(uid++);
    let bands,cuts,nums,clips;
    if(n===3){
      bands=`<rect x="80" y="18" width="160" height="52" fill="var(--hair)" opacity=".45"/><rect x="80" y="70" width="160" height="40" fill="var(--hair)" opacity=".7"/><rect x="80" y="110" width="160" height="60" fill="var(--hair)"/>`;
      cuts=`<path d="M96 70 L224 70 M95 110 L225 110" stroke="var(--surface)" stroke-width="3" stroke-dasharray="6 4"/>`;
      nums=[[48,"3"],[91,"2"],[138,"1"]];
      clips=`<rect x="196" y="40" width="28" height="9" rx="4" fill="var(--accent)" transform="rotate(-18 210 44)"/><rect x="196" y="84" width="28" height="9" rx="4" fill="var(--accent)" transform="rotate(-18 210 88)"/>`;
    }else{
      bands=`<rect x="80" y="18" width="160" height="74" fill="var(--hair)" opacity=".5"/><rect x="80" y="92" width="160" height="78" fill="var(--hair)"/>`;
      cuts=`<path d="M95 92 L225 92" stroke="var(--surface)" stroke-width="3" stroke-dasharray="6 4"/>`;
      nums=[[58,"2"],[128,"1"]];
      clips=`<rect x="196" y="54" width="28" height="9" rx="4" fill="var(--accent)" transform="rotate(-18 210 58)"/>`;
    }
    const nn=nums.map(([y,t])=>`<circle cx="160" cy="${y}" r="10" fill="var(--accent)"/><text x="160" y="${y+4}" text-anchor="middle" class="num">${t}</text>`).join("");
    return svg(`<defs><clipPath id="${id}"><path d="${HEAD}"/></clipPath></defs><g clip-path="url(#${id})">${bands}</g>${cuts}${clips}${nn}${L(46,128,"начинать","middle","lblA")}${L(46,142,"снизу","middle","lblA")}<path d="M70 136 L132 136" stroke="var(--accent)" stroke-width="2"/>${head(140,136,0)}${L(262,52,"заколка")}`,"Деление волос на зоны, вид сзади");
  },
  strand:(w)=>svg(`<rect x="96" y="16" width="128" height="134" rx="10" fill="var(--hair)" opacity=".28"/>${strand(160,16,150,30)}<path d="M145 162 L175 162 M145 156 L145 168 M175 156 L175 168" stroke="var(--accent)" stroke-width="2"/>${L(160,178,w,"middle","lblA")}${L(62,86,"остальные")}${L(62,100,"заколоты")}${L(262,86,"расчешите")}${L(262,100,"прядь")}`,"Ширина пряди"),
  iron:()=>{
    const c=curl(160,48,166,22,6);
    return svg(`${strand(160,12,166,14,.2)}<path d="M160 12 L160 48" stroke="var(--hair)" stroke-width="13" stroke-linecap="round"/><path d="${c}" pathLength="1" class="draw" stroke="var(--hair)" stroke-width="12" fill="none" stroke-linecap="round"/>
    <g class="slide"><rect x="122" y="34" width="76" height="9" rx="4" fill="var(--tool)"/><rect x="122" y="46" width="76" height="9" rx="4" fill="var(--tool)"/><rect x="127" y="43" width="66" height="3" fill="var(--heat)"/><rect x="198" y="37" width="72" height="15" rx="7" fill="var(--tool)"/></g>
    <path d="M106 28 A20 20 0 1 0 110 64" stroke="var(--accent)" stroke-width="2.2" fill="none"/>${head(111,66,62)}${L(52,24,"½ оборота","middle","lblA")}${L(52,38,"от лица","middle","lblA")}
    <path d="M292 70 L292 148" stroke="var(--muted)" stroke-width="2"/>${head(292,156,90,"var(--muted)")}${L(292,62,"медленно")}`,"Утюжок поворачивается на пол-оборота и ведётся вниз");
  },
  direction:()=>svg(`<path d="M106 150 C94 92 104 34 160 32 C216 34 226 92 214 150" stroke="var(--hair)" stroke-width="20" fill="none" stroke-linecap="round"/><ellipse cx="160" cy="94" rx="34" ry="44" fill="var(--skin)"/><circle cx="147" cy="88" r="2.4" fill="var(--tool)"/><circle cx="173" cy="88" r="2.4" fill="var(--tool)"/><path d="M152 114 Q160 119 168 114" stroke="var(--tool)" stroke-width="2" fill="none"/>
  <path d="M96 96 C76 92 64 102 60 120" stroke="var(--accent)" stroke-width="2.4" fill="none"/>${head(59,124,105)}<path d="M224 96 C244 92 256 102 260 120" stroke="var(--accent)" stroke-width="2.4" fill="none"/>${head(261,124,75)}${L(52,148,"от лица","middle","lblA")}${L(268,148,"от лица","middle","lblA")}`,"Направление закручивания от лица"),
  cool:(mode="rest",txt="1–2 мин")=>{
    const c=`<path d="${curl(110,20,166,20,6)}" stroke="var(--hair)" stroke-width="12" fill="none" stroke-linecap="round"/>`;
    if(mode==="air"){
      const lines=[60,90,120].map(y=>`<path d="M268 ${y} L150 ${y}" stroke="var(--air)" stroke-width="2.2" class="flow"/>${head(146,y,180,"var(--air)")}`).join("");
      return svg(`${c}${lines}${L(230,44,"холодный воздух","middle","lblA")}${L(230,150,txt)}`,"Фиксация холодным воздухом");
    }
    return svg(`${c}<circle cx="230" cy="88" r="32" fill="none" stroke="var(--line)" stroke-width="3"/><path d="M230 88 L230 66 M230 88 L246 96" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="230" cy="88" r="3" fill="var(--accent)"/>${L(230,140,txt,"middle","lblA")}${L(230,154,"не трогать")}`,"Дать локону остыть");
  },
  finish:()=>{
    const pts=[[226,24],[240,18],[252,28],[236,34],[262,20],[248,40]];
    return svg(`<path d="${curl(84,22,160,15,8)}" stroke="var(--hair)" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M128 92 L180 92" stroke="var(--accent)" stroke-width="2.4"/>${head(186,92,0)}<path d="${curl(236,46,166,30,4)}" stroke="var(--hair)" stroke-width="16" fill="none" stroke-linecap="round" opacity=".9"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="var(--air)" class="puff" style="animation-delay:${i*.3}s"/>`).join("")}${L(154,80,"пальцами","middle","lblA")}${L(84,176,"тугой локон")}${L(236,178,"мягкая волна")}`,"Разобрать локоны пальцами");
  },
  roughDry:()=>svg(`<path d="${HEAD}" fill="var(--hair)" opacity=".85"/><circle cx="268" cy="34" r="20" fill="var(--tool)"/><rect x="214" y="27" width="40" height="14" rx="3" fill="var(--tool)"/><rect x="260" y="50" width="16" height="44" rx="6" fill="var(--tool)"/><path d="M210 30 L182 24 M210 36 L178 40 M210 42 L186 54" stroke="var(--air)" stroke-width="2.2" class="flow"/>${[[128,46],[160,34],[192,46]].map(p=>`<path d="M${p[0]} ${p[1]+16} L${p[0]} ${p[1]}" stroke="var(--surface)" stroke-width="2.4"/>${head(p[0],p[1]-3,-90,"var(--surface)")}`).join("")}${L(160,176,"сушим без щётки до 70–80%","middle","lblA")}${L(50,90,"корни")}${L(50,104,"поднимать")}`,"Подсушивание феном без щётки"),
  brush:()=>svg(`${strand(150,10,170,22,.35)}<path d="M108 50 L108 140" stroke="var(--muted)" stroke-width="2"/>${head(108,148,90,"var(--muted)")}
  <g class="slide2"><rect x="139" y="4" width="22" height="22" rx="3" fill="var(--tool)"/><rect x="160" y="0" width="60" height="18" rx="9" fill="var(--tool)"/><path d="M144 30 L144 50 M150 30 L150 52 M156 30 L156 50" stroke="var(--air)" stroke-width="2.2" class="flow"/><circle cx="150" cy="72" r="21" fill="none" stroke="var(--accent)" stroke-width="4" stroke-dasharray="2 3"/><circle cx="150" cy="72" r="16" fill="var(--tool)"/><rect x="168" y="68" width="84" height="9" rx="4" fill="var(--tool)"/></g>

  },
  dyson:{
    tab:"Dyson",sub:"HS08 · HS09",title:"Локоны стайлером Dyson",
    stats:p=>[
      ["Модель",`${p.M.full} (${p.M.name})`],
      ["Цилиндр",p.B.name],
      ["Время",timeStr(p,{short:15,medium:25,long:35,xlong:45})]
    ],
    need:p=>[`${p.M.full} (${p.M.name})`,"цилиндр "+p.B.name.toLowerCase(),"насадка для сушки",p.type==="curly"?(p.m==="hs08"?"жёсткая разглаживающая щётка":"щётка с петлями"):"мусс или спрей","зажимы"],
    warn:p=>{
      const w=[];
      if(!p.B.len.includes(p.length))w.push(`Цилиндр «${p.B.name}» обычно берут для другой длины волос. Для ваших лучше подойдёт «${BARRELS[recBarrel(p.m,p)].name}».`);
      if(p.m==="hs09"&&p.length==="xlong")w.push("Длинных цилиндров для HS09 в комплектах нет. На волосах ниже лопаток берите пряди тоньше и направляйте прядь по цилиндру вниз, чтобы витки не наслаивались.");
      return w;
    },
    steps:[
      {t:"Высушите волосы",fig:p=>F.damp("сухие на вид","но прохладные","на ощупь"),text:"Вымойте голову и высушите волосы насадкой для сушки. Перед локонами волосы должны выглядеть сухими, но оставаться прохладными на ощупь. Нанесите лёгкий мусс или спрей для укладки.",
        tip:p=>p.type==="curly"?`Кудрявые волосы прорабатывайте небольшими прядями ${p.m==="hs08"?"жёсткой разглаживающей щёткой":"щёткой с петлями"} сверху вниз, от кончиков к корням, пока они не станут чуть влажными.`:null},
      {t:"Настройте профиль",fig:p=>F.settings(),text:"В приложении MyDyson ответьте на несколько вопросов о типе и длине волос. Стайлер запомнит профиль и в режиме i.d. curl сам подберёт нагрев, поток и время локона.",
        tip:p=>p.m==="hs09"?"HS09 сам распознаёт надетую насадку и подставляет её настройки. Подходят только насадки Co-anda2x.":"Без приложения можно работать вручную: нагрев и поток выбираются кнопками на ручке. К HS08 подходят и цилиндры от предыдущих Airwrap."},
      {t:"Разделите на зоны",fig:p=>F.sections(p.length==="short"?2:3),text:"Заколите верхние зоны и начинайте с нижней, у затылка.",tip:zoneTip},
      {t:"Возьмите прядь",fig:p=>F.strand(p.density==="thick"?"около 2 см":"2–3 см"),text:"Отделите прядь и тщательно расчешите. Спутанная прядь закрутится неровно.",
        tip:p=>p.density==="thick"?"На густых волосах берите пряди тоньше, иначе воздух не пройдёт насквозь.":null},
      {t:"Поднесите кончик к цилиндру",fig:p=>F.barrel(p.b),text:"Держите стайлер вертикально и поднесите кончик пряди к цилиндру: воздух сам притянет и обернёт прядь. Ведите стайлер к голове, крутить его не нужно. Пряди у лица закручивайте от лица.",
        tip:p=>`Цилиндр «${p.B.name}»: ${p.B.use}`+(p.b==="conical"?" Узким концом подводите цилиндр ближе к корням.":"")+(p.m==="hs08"?" Направление меняется поворотом прохладного наконечника цилиндра.":" Направление закрутки сверяйте по стрелке на цилиндре.")},
      {t:"Нагрев и холод",fig:p=>F.timer(dyHold(p),"5 с",p.b),text:"В режиме i.d. curl стайлер сам отсчитает время, обдаст локон холодом и ослабит поток. В ручном режиме держите горячий воздух несколько секунд, затем холодный около 5 секунд.",
        tip:p=>`Для ручного режима на ваших волосах: нагрев <strong>${dyHold(p)}</strong>, затем холод.`},
      {t:"Снимите цилиндр",fig:p=>F.release(p.b),text:"Когда поток ослабнет, плавно опустите стайлер вниз, и локон соскользнёт с цилиндра. Не тяните прядь.",tip:p=>null},
      {t:"Разберите и зафиксируйте",fig:p=>F.finish(),text:"Дайте всем локонам остыть. Затем разберите их пальцами и сбрызните лаком.",
        tip:p=>p.type!=="straight"?"Разбирайте только пальцами, расчёска распушит волосы.":null}
    ],
    mistakes:["Волосы влажные или горячие: локон не закрепляется и быстро распадается.","Насадки от другой модели: у HS08 и HS09 они несовместимы.","Цилиндр короче пряди: витки наслаиваются, середина остаётся влажной.","Сняли локон до холодного обдува: он не закрепился."]
  }
};
const MODELS={
  hs08:{name:"HS08",full:"Airwrap i.d.",barrels:["conical","b40L","b30","b30L","b20"],note:"В комплекте Straight+Wavy: конический цилиндр и длинный 40 мм. Цилиндры 20 и 30 мм от предыдущих Airwrap тоже подходят."},
  hs09:{name:"HS09",full:"Airwrap Co-anda2x",barrels:["conical","b40","b30"],note:"Подходят только насадки Co-anda2x: цилиндры от HS05 и HS08 не надеваются. Набор цилиндров зависит от комплекта, проверьте свою коробку."}
};
const BARRELS={
  conical:{name:"Конический",use:"сужается к кончику, поэтому локон шире у корня и уже к концам и выглядит естественно. Подходит и для коротких волос.",len:["short","medium","long","xlong"]},
  b20:{name:"20 мм",use:"тугие упругие локоны. На тонких волосах держатся дольше.",len:["short","medium"]},
  b30:{name:"30 мм",use:"объёмные локоны среднего размера.",len:["medium","long"]},
  b30L:{name:"30 мм длинный",use:"объёмные локоны на длинных волосах: прядь ложится в один слой.",len:["long","xlong"]},
  b40:{name:"40 мм",use:"крупные свободные локоны и волны на средних и длинных волосах.",len:["medium","long","xlong"]},
  b40L:{name:"40 мм длинный",use:"крупные волны на длинных волосах: прядь ложится в один слой.",len:["long","xlong"]}
};
function recBarrel(m,p){
  if(p.length==="short")return "conical";
  if(m==="hs08"){if(p.length==="medium")return p.density==="fine"?"b20":"b30";if(p.length==="long")return p.density==="fine"?"b30L":"b40L";return "b40L";}
  return p.length==="medium"?"b30":"b40";
}
function zoneTip(p){
  if(p.length==="short")return "На коротких волосах хватит двух зон.";
  if(p.length==="xlong")return "На волосах ниже лопаток удобнее разделить каждую зону ещё на левую и правую половину.";
  if(p.length==="long"&&p.density==="thick")return "На длинных густых волосах удобнее разделить каждую зону ещё на левую и правую половину.";
  return null;
}
const ciD=p=>by({short:"19–25 мм",medium:"25 мм",long:"25–32 мм",xlong:"32–38 мм"},p.length);
const ciHold=p=>by({fine:"5–6 с",medium:"8 с",thick:"10–12 с"},p.density);
const brD=p=>by({short:"Ø 25–35 мм",medium:"Ø 45 мм",long:"Ø 53–65 мм",xlong:"Ø 65 мм и больше"},p.length);
const dyHold=p=>by({fine:"5–8 с",medium:"8–10 с",thick:"10–15 с"},p.density);
function timeStr(p,base,extra=0){let m=base[p.length]+extra+(p.density==="thick"?10:0)-(p.density==="fine"?5:0);return `≈ ${m} мин`;}
function strandW(p){return by({fine:"до 3 см",medium:"2–3 см",thick:"1,5–2 см"},p.density);}

/* ---------- рендер ---------- */
function chips(){
  for(const k of Object.keys(OPTS)){
    document.getElementById("g-"+k).innerHTML=OPTS[k].map(([v,t,s])=>`<input type="radio" name="${k}" id="${k}-${v}" value="${v}" ${P[k]===v?"checked":""}><label for="${k}-${v}">${t}${s?`<small>${s}</small>`:""}</label>`).join("");
  }
  document.querySelectorAll(".chips input").forEach(i=>i.addEventListener("change",e=>{P[e.target.name]=e.target.value;try{localStorage.setItem("ukl-profile",JSON.stringify(P));}catch(_){}render();}));
}
function tabs(){
  const el=document.getElementById("tabs");
  el.innerHTML=Object.entries(TECH).map(([k,v])=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${k===T}">${v.tab}<small>${v.sub}</small></button>`).join("");
  el.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{T=b.id.slice(4);try{history.replaceState(null,"","#"+T);}catch(_){}el.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render();}));
}
function ctx(){
  const p={...P};
  if(T==="dyson"){
    const m=MODELS[D.model]?D.model:"hs08";const M=MODELS[m];
    const b=(D.barrel&&M.barrels.includes(D.barrel))?D.barrel:recBarrel(m,P);
    Object.assign(p,{m,M,b,B:BARRELS[b]});
  }
  return p;
}
function saveD(){try{localStorage.setItem("ukl-dyson",JSON.stringify(D));}catch(_){}}
function dysonPicker(p){
  const rec=recBarrel(p.m,p);
  const models=Object.entries(MODELS).map(([k,v])=>`<input type="radio" name="dy-model" id="dym-${k}" value="${k}" ${p.m===k?"checked":""}><label for="dym-${k}">${v.name}<small>${v.full}</small></label>`).join("");
  const barrels=p.M.barrels.map(k=>`<input type="radio" name="dy-barrel" id="dyb-${k}" value="${k}" ${p.b===k?"checked":""}><label for="dyb-${k}">${BARRELS[k].name}${k===rec?"<small>для ваших волос</small>":""}</label>`).join("");
  return `<div class="panel"><div class="group"><span class="eyebrow">Модель</span><div class="chips">${models}</div></div><div class="group"><span class="eyebrow">Цилиндр</span><div class="chips">${barrels}</div></div><p class="note">${p.M.note}</p></div>`;
}
function render(){
  const t=TECH[T],p=ctx();
  const prof=`${OPTS.type.find(o=>o[0]===P.type)[1].toLowerCase()}, ${OPTS.density.find(o=>o[0]===P.density)[1].toLowerCase()}, ${lens[P.length]}`;
  const warns=t.warn(p).map(w=>`<div class="warn">${w}</div>`).join("");
  document.getElementById("lesson").innerHTML=`<div><div class="eyebrow">Для волос: ${prof}</div><h2>${t.title}</h2></div>
    ${T==="dyson"?dysonPicker(p):""}
    <div class="stats">${t.stats(p).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${v}</b></div>`).join("")}</div>
    ${warns}
    <div class="group"><span class="eyebrow">Понадобится</span><ul class="need">${t.need(p).map(n=>`<li>${n}</li>`).join("")}</ul></div>`;
  document.querySelectorAll('input[name="dy-model"]').forEach(i=>i.addEventListener("change",e=>{D={model:e.target.value,barrel:null};saveD();render();}));
  document.querySelectorAll('input[name="dy-barrel"]').forEach(i=>i.addEventListener("change",e=>{D.barrel=e.target.value;saveD();render();}));
  document.getElementById("steps").innerHTML=t.steps.map(s=>{const tip=s.tip(p);return `<li class="step"><div class="fig">${s.fig(p)}</div><div class="body"><h3>${s.t}</h3><p>${s.text}</p>${tip?`<div class="tip"><strong>Для ваших волос.</strong> ${tip}</div>`:""}</div></li>`;}).join("");
  document.getElementById("mistakes").innerHTML=t.mistakes.map(m=>`<li>${m}</li>`).join("");
}
chips();tabs();render();
</script>

</body>
</html>
